spring:
  application:
    name: gymtracker-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/gymtracker}
    username: ${DB_USER:gym}
    password: ${DB_PASSWORD:gym}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
    ttl: 7d
