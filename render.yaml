databases:
  - name: gymtracker-db
    plan: free
    databaseName: gymtracker
    user: gym

services:
  - type: web
    name: gymtracker-api
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: gymtracker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gymtracker-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: gymtracker-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: gymtracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gymtracker-db
          property: password
      - key: JWT_SECRET
        generateValue: true
